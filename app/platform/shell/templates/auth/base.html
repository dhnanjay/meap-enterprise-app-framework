<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.app_name }} — Authentication</title>
  <link rel="stylesheet" href="/static/css/meap.css">
  <style>
    .auth-canvas{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fafafa}
    .auth-panel{width:min(100%,460px);background:#fff;border:1px solid #e4e4e7;border-radius:6px;padding:28px}
    .auth-panel--wide{width:min(100%,900px)}
    .auth-stack{display:grid;gap:16px}.auth-field{display:grid;gap:6px}.auth-field input,.auth-field select{min-height:40px;padding:8px 10px;border:1px solid #d4d4d8;border-radius:4px}
    .auth-qr{display:block;width:220px;height:220px;margin:8px auto}.auth-error{padding:10px;border-left:3px solid #b91c1c;background:#fef2f2;color:#7f1d1d}
    .auth-notice{padding:12px;border-left:3px solid #2563eb;background:#eff6ff;overflow-wrap:anywhere}.auth-codes{columns:2;list-style:none;padding:0;font-family:ui-monospace,monospace}.auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  </style>
</head>
<body><main class="auth-canvas">{% block auth_content %}{% endblock %}</main></body>
</html>
