<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.app_name }} — Authentication</title>
  <link rel="stylesheet" href="/static/css/meap.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <style>
    .auth-canvas{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fafafa}
    .auth-panel{width:min(100%,460px);background:#fff;border:1px solid #e4e4e7;border-radius:6px;padding:28px}
    .auth-panel--wide{width:min(100%,1120px)}
    .auth-stack{display:grid;gap:16px}.auth-field{display:grid;gap:6px}.auth-field input,.auth-field select{min-height:40px;padding:8px 10px;border:1px solid #d4d4d8;border-radius:4px}
    .auth-qr{display:block;width:220px;height:220px;margin:8px auto}.auth-error{padding:10px;border-left:3px solid #b91c1c;background:#fef2f2;color:#7f1d1d}
    .auth-notice{padding:12px;border-left:3px solid #2563eb;background:#eff6ff;overflow-wrap:anywhere}.auth-success{padding:12px;border-left:3px solid #15803d;background:#f0fdf4;color:#14532d}.auth-warning{padding:12px;border-left:3px solid #b45309;background:#fffbeb;color:#78350f}.auth-codes{columns:2;list-style:none;padding:0;font-family:ui-monospace,monospace}.auth-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.auth-actions--start{justify-content:flex-start}.auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.auth-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #e4e4e7;border-radius:6px}.auth-summary>div{padding:14px;border-right:1px solid #e4e4e7;min-width:0}.auth-summary>div:last-child{border-right:0}.auth-label{display:block;color:#71717a;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.auth-value{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.auth-section{border-top:1px solid #e4e4e7;padding-top:18px}.auth-risk-list{display:grid;gap:10px}.auth-risk-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e4e4e7}.auth-risk-row:last-child{border-bottom:0}.auth-confirm{display:flex;gap:8px;align-items:flex-start}.auth-result-list{display:grid;gap:8px;padding:0;list-style:none;font-family:ui-monospace,monospace;overflow-wrap:anywhere}.auth-permission-group{display:grid;gap:8px}.auth-permission-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.auth-permission-heading h2{margin:0}.auth-permission-summary{padding:10px 12px;border:1px solid #e4e4e7;background:#fafafa;font-variant-numeric:tabular-nums}
    @media(max-width:720px){.auth-canvas{display:block;padding:12px}.auth-panel{padding:20px}.auth-grid,.auth-summary{grid-template-columns:1fr}.auth-summary>div{border-right:0;border-bottom:1px solid #e4e4e7}.auth-summary>div:last-child{border-bottom:0}.auth-risk-row{align-items:flex-start;flex-direction:column}.auth-codes{columns:1}}
  </style>
</head>
<body><main class="auth-canvas">{% block auth_content %}{% endblock %}</main></body>
</html>
