# Alembic configuration for MEAP (Section 68)
# Database URL is overridden in migrations/env.py from application settings.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Default URL — overridden by env.py from MEAP settings
sqlalchemy.url = sqlite:///./meap.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
